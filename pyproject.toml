[project]
name = "laruso"
version = "0.1.0"
description = "Laruso backend: guest data, the model gateway, and the agent system"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "pydantic-settings",
    "pydantic[email]",
    "pyjwt",
    "bcrypt",
    "python-multipart",
]

[project.optional-dependencies]
# Added when each piece is built:
# agent = ["langgraph", "ollama"]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# One Python project for backend, ai and agent_system (see PROJECT_OVERVIEW.md for why
# they aren't three separate installable packages). Code stays logically separated by
# directory and by the dependency rules documented there; this just controls what's on
# the import path.
[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ai*", "agent_system*"]

[tool.pytest.ini_options]
testpaths = ["backend", "ai", "agent_system", "tests"]
