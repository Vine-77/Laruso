[project]
name = "laruso"
version = "0.1.0"
description = "Laruso backend: guest data, scoring, and the follow-up agent"
requires-python = ">=3.11"
dependencies = [
    "pandas",
]

[project.optional-dependencies]
# Added when each piece is built:
# agent = ["langgraph", "ollama"]
# api = ["fastapi", "uvicorn"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["laruso*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
